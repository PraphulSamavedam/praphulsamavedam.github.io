<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
  <meta http-equiv="refresh" content="3;url=/">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; font-family:system-ui,sans-serif; background:#0f172a; color:#e2e8f0; text-align:center; }
    h1 { font-size:3rem; margin:0 0 .5rem; }
    p { color:#94a3b8; }
    a { color:#60a5fa; }
    .countdown { font-weight:bold; color:#60a5fa; }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>Invalid path — redirecting to <a href="/">homepage</a> in <span class="countdown" id="t">3</span> seconds...</p>
  </div>
  <script>let n=3;setInterval(()=>{if(--n>=0)document.getElementById('t').textContent=n},1000);</script>
</body>
</html>
